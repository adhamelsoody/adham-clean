<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استعادة كلمة المرور — ذات القرآنية</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="styles.css" />
<script>(function(){try{var t=localStorage.getItem("mirath_theme")||"light";
  document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px;
         background: var(--bg, #f4f7f7); }
  .rs { width: min(430px, 100%); background: var(--surface, #fff);
        border: 1px solid var(--border-soft, #eef1f0); border-radius: 16px;
        padding: 28px 26px; box-shadow: 0 14px 44px rgba(10,30,35,.10); }
  .rs h1 { font-size: 20px; margin: 0 0 4px; }
  .rs .sub { font-size: 13px; color: var(--text-faint, #8a97a1); margin-bottom: 20px; }
  .rs .step { display: none; }
  .rs .step.on { display: block; }
  .rs label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .rs input { width: 100%; padding: 11px 13px; font: inherit; font-size: 14px;
              border: 1px solid var(--border-soft, #eef1f0); border-radius: 10px;
              background: var(--surface, #fff); color: var(--text-main, #0f2533); }
  .rs input:focus { outline: none; border-color: var(--brand-main, #0b7f83);
                    box-shadow: 0 0 0 3px var(--brand-soft, #e8f4f3); }
  .rs .fld { margin-bottom: 14px; }
  .rs .btn-go { width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
        font: inherit; font-weight: 700; color: #fff;
        background: linear-gradient(140deg, #0b7f83, #04525a); }
  .rs .btn-go:disabled { opacity: .6; cursor: default; }
  .rs .msg { margin-top: 14px; padding: 10px 12px; border-radius: 10px;
             font-size: 13px; line-height: 1.7; display: none; }
  .rs .msg.on { display: block; }
  .rs .msg.err { background: #fdf0ef; color: #b3261e; }
  .rs .msg.ok  { background: #eaf6ef; color: #1c6b3f; }
  .rs .back { display: block; text-align: center; margin-top: 16px; font-size: 13px;
              color: var(--brand-dark, #004b50); text-decoration: none; }
  .rs .steps { display: flex; gap: 6px; margin-bottom: 20px; }
  .rs .steps i { flex: 1; height: 3px; border-radius: 3px; background: var(--border-soft, #eef1f0); }
  .rs .steps i.on { background: var(--brand-main, #0b7f83); }
  .rs .hint { font-size: 11.5px; color: var(--text-faint, #8a97a1); margin-top: 6px; line-height: 1.7; }
  #recap { margin: 10px 0; }
</style>
</head>
<body>

<div class="rs">
  <h1>استعادة كلمة المرور</h1>
  <div class="sub">يصلك رمز تحقّق على جوالك المسجَّل في النظام</div>
  <div class="steps"><i class="on" id="s1"></i><i id="s2"></i><i id="s3"></i></div>

  <!-- ١ — الهوية والجوال -->
  <div class="step on" id="step1">
    <div class="fld">
      <label for="rid">رقم الهوية</label>
      <input id="rid" dir="ltr" inputmode="numeric" maxlength="10" placeholder="1110071212"
             oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
    </div>
    <div class="fld">
      <label for="rphone">رقم الجوال</label>
      <input id="rphone" dir="ltr" inputmode="tel" placeholder="05xxxxxxxx"
             oninput="this.value=this.value.replace(/[^0-9+]/g,'')">
      <div class="hint">اكتب الجوال المسجَّل لهذا الحساب. الرمز يصل عليه، ولا تُقبل استعادة
        بجوال غيره.</div>
    </div>
    <div id="recap"></div>
    <button class="btn-go" id="btn1">إرسال الرمز</button>
  </div>

  <!-- ٢ — الرمز -->
  <div class="step" id="step2">
    <div class="fld">
      <label for="rcode">رمز التحقّق</label>
      <input id="rcode" dir="ltr" inputmode="numeric" maxlength="6" placeholder="123456"
             oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)">
      <div class="hint" id="sentTo"></div>
    </div>
    <button class="btn-go" id="btn2">تأكيد الرمز</button>
  </div>

  <!-- ٣ — كلمة المرور -->
  <div class="step" id="step3">
    <div class="fld">
      <label for="rpass">كلمة المرور الجديدة</label>
      <input id="rpass" type="password" dir="ltr" placeholder="ثمانية أحرف على الأقل">
    </div>
    <div class="fld">
      <label for="rpass2">تأكيد كلمة المرور</label>
      <input id="rpass2" type="password" dir="ltr">
    </div>
    <button class="btn-go" id="btn3">حفظ كلمة المرور</button>
  </div>

  <div class="msg" id="msg"></div>
  <a class="back" href="login.html">← رجوع لتسجيل الدخول</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  "use strict";
  var REGION = "europe-west1";
  var auth = window.__auth || (typeof firebase !== "undefined" ? firebase.auth() : null);
  var confirmation = null;
  var verifier = null;

  var $ = function (id) { return document.getElementById(id); };

  /* رقم الهوية يصل من login.html فلا يُكتب مرتين */
  try {
    var pre = new URLSearchParams(location.search).get("id");
    if (pre) $("rid").value = String(pre).replace(/\D/g, "").slice(0, 10);
  } catch (e) {}

  function say(text, kind) {
    var m = $("msg");
    m.className = "msg on " + (kind || "err");
    m.textContent = text;
  }
  function clearMsg() { $("msg").className = "msg"; }

  function step(n) {
    [1, 2, 3].forEach(function (i) {
      $("step" + i).classList.toggle("on", i === n);
      $("s" + i).classList.toggle("on", i <= n);
    });
    clearMsg();
  }

  /* الرقم المحلي يبدأ بصفر ولا يقبله فايربيس — يُستبدل برمز الدولة */
  function e164(raw) {
    var n = String(raw || "").replace(/[^\d+]/g, "");
    if (!n) return "";
    if (n.charAt(0) === "+") return n;
    if (n.slice(0, 2) === "00") return "+" + n.slice(2);
    if (n.charAt(0) === "0") return "+966" + n.slice(1);
    return n.length >= 11 ? "+" + n : "+966" + n;
  }

  function mask(p) {
    return p.length > 5 ? p.slice(0, 4) + "•••••" + p.slice(-3) : p;
  }

  /* ---------- ١) إرسال الرمز ---------- */
  $("btn1").onclick = function () {
    var id = $("rid").value.trim();
    var phone = e164($("rphone").value);

    if (id.length !== 10) { say("رقم الهوية عشرة أرقام."); return; }
    if (phone.length < 10) { say("رقم الجوال غير صحيح."); return; }
    if (!auth) { say("تعذّر الاتصال بالخدمة."); return; }

    this.disabled = true; this.textContent = "جارٍ الإرسال…";
    var btn = this;

    try {
      if (!verifier) {
        verifier = new firebase.auth.RecaptchaVerifier("recap", { size: "normal" }, auth);
      }
    } catch (e) { say("تعذّر تجهيز التحقّق: " + e.message); btn.disabled = false; btn.textContent = "إرسال الرمز"; return; }

    verifier.verify().then(function () {
      return auth.signInWithPhoneNumber(phone, verifier);
    }).then(function (res) {
      confirmation = res;
      $("sentTo").textContent = "أُرسل الرمز إلى " + mask(phone);
      step(2);
      btn.disabled = false; btn.textContent = "إرسال الرمز";
    }).catch(function (e) {
      var m = e.message || "";
      if (/invalid-phone-number/.test(e.code || "")) m = "صيغة الجوال غير صحيحة.";
      if (/too-many-requests/.test(e.code || "")) m = "محاولات كثيرة — انتظر قليلاً.";
      if (/operation-not-allowed/.test(e.code || "")) m = "الدخول بالجوال غير مفعّل في المشروع — فعّله من Firebase Console ← Authentication ← Sign-in method ← Phone.";
      say(m);
      btn.disabled = false; btn.textContent = "إرسال الرمز";
      try { verifier.clear(); verifier = null; } catch (er) {}
    });
  };

  /* ---------- ٢) تأكيد الرمز ---------- */
  $("btn2").onclick = function () {
    var code = $("rcode").value.trim();
    if (code.length !== 6) { say("الرمز ستة أرقام."); return; }
    if (!confirmation) { say("انتهت الجلسة — ابدأ من جديد."); step(1); return; }

    this.disabled = true; this.textContent = "جارٍ التحقّق…";
    var btn = this;

    confirmation.confirm(code).then(function () {
      step(3);
      btn.disabled = false; btn.textContent = "تأكيد الرمز";
    }).catch(function (e) {
      say(/invalid-verification-code/.test(e.code || "") ? "الرمز غير صحيح." : (e.message || "تعذّر التحقّق."));
      btn.disabled = false; btn.textContent = "تأكيد الرمز";
    });
  };

  /* ---------- ٣) كلمة المرور الجديدة ---------- */
  $("btn3").onclick = function () {
    var p1 = $("rpass").value, p2 = $("rpass2").value;
    if (p1.length < 8) { say("كلمة المرور ثمانية أحرف على الأقل."); return; }
    if (p1 !== p2) { say("الكلمتان غير متطابقتين."); return; }

    this.disabled = true; this.textContent = "جارٍ الحفظ…";
    var btn = this;

    firebase.app().functions(REGION)
      .httpsCallable("resetPasswordSMS")({ username: $("rid").value.trim(), password: p1 })
      .then(function (r) {
        say("تم تغيير كلمة المرور" + (r.data.name ? " لحساب " + r.data.name : "") +
            ". يمكنك الدخول الآن.", "ok");
        return auth.signOut();
      })
      .then(function () {
        setTimeout(function () { location.href = "login.html"; }, 2200);
      })
      .catch(function (e) {
        var m = (e && e.message) || "تعذّر الحفظ.";
        if (/not-found/.test(e.code || "")) m = "الخدمة غير منشورة بعد — راجع الإدارة.";
        say(m);
        btn.disabled = false; btn.textContent = "حفظ كلمة المرور";
      });
  };
})();
</script>
</body>
</html>
